apiVersion: batch/v1
kind: Job
metadata:
  name: oracle-dbops-execution
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      containers:
      - name: oracle-runner
        image: bus57790/oracle-dbops:1
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
          - |
            sqlplus sys/"${DB_PASSWORD}"@//192.168.1.188:1521/ORCL as sysdba @/data/scripts/manage_db.sql
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oracle-db-secret
              key: SYS_PASSWORD
      restartPolicy: Never
  backoffLimit: 1
