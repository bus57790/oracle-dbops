apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oracle-dbops-pipeline
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/bus57790/oracle-dbops.git'
    targetRevision: HEAD
    path: 'manifests'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
